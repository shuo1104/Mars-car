<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火星“流浪者1号”漫游探索 - Wanderer 1 Mars Rover Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for futuristic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js R128 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Three.js Post-Processing CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- Sandstorm Atmosphere Overlay -->
    <div id="sandstorm-overlay" class="sandstorm-overlay"></div>

    <!-- Ultra-Clean Minimal HUD Overlay -->
    <div id="hud">
        <!-- Top Left: Minimal Rover Title -->
        <div class="hud-panel top-left">
            <div class="panel-header">
                <span class="badge">WANDERER-1</span>
                <span class="status-indicator active"></span>
                <span class="title">火星漫游探索</span>
            </div>
        </div>

        <!-- Top Right: Coordinates & Audio -->
        <div class="hud-panel top-right">
            <div class="panel-header">
                <span id="nav-coords" class="coords">X: 000 | Z: 000</span>
                <button id="btn-audio" class="hud-btn mini">
                    <svg id="icon-sound-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
            </div>
        </div>

        <!-- Bottom Left: Speedometer & Headlight Status -->
        <div class="hud-panel bottom-left">
            <div class="speed-container">
                <div class="speed-dial">
                    <span id="speed-val" class="speed-number">0.0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <div class="telemetry">
                    <div class="telem-item">
                        <span class="label">探照大灯</span>
                        <span id="headlight-status" class="val badge-off">关闭 [L]</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Center: Essential Controls Bar (WASD & L) -->
        <div class="hud-panel bottom-center">
            <div class="controls-hint-bar">
                <div class="key-item"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>驾驶移动</span></div>
                <div class="key-item"><kbd>L</kbd><span>开关大灯</span></div>
                <div class="key-item"><kbd>C</kbd><span>切换视角</span></div>
                <div class="key-item"><kbd>Space</kbd><span>刹车</span></div>
            </div>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls" class="touch-controls">
        <div class="dpad">
            <button id="btn-up" class="dbtn up">▲</button>
            <button id="btn-left" class="dbtn left">◀</button>
            <button id="btn-right" class="dbtn right">▶</button>
            <button id="btn-down" class="dbtn down">▼</button>
        </div>
        <div class="action-btns">
            <button id="btn-action-l" class="abtn light-btn">大灯 [L]</button>
            <button id="btn-action-c" class="abtn cam-btn">视角 [C]</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/rover.js"></script>
    <script src="js/world.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
